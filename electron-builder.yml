# 安装包（设计文档 2.1、12 节）。macOS 有签名 secret 时签名并公证，没有时 ad-hoc 签名（BTL-258）；Windows 不签名。
# 发布（推 tag、建 release）由用户完成：publish 关掉，也不配置自动更新。
appId: io.statecore.butler
productName: Butler
copyright: Copyright © 2026 Yuchen Lin
directories:
  output: dist
  # 图标等打包资源的目录。不能用 build/：那里是 hook 和记忆 MCP 的构建产物。
  # 图标由 scripts/render-icons.mjs 从 build-resources/icon-src/ 的 SVG 生成（pnpm icons）。
  buildResources: build-resources
files:
  - out/**/*
  - package.json
  # 运行时用不到的东西：source map，node-pty 的测试、TypeScript / C++ 源码和 winpty 源码（Windows 用 prebuilds 和 third_party/conpty）。
  - "!**/*.map"
  - "!**/node_modules/node-pty/lib/**/*.test.js"
  - "!**/node_modules/node-pty/src/**"
  - "!**/node_modules/node-pty/deps/**"
# 原生模块不能在 asar 里执行。
asarUnpack:
  - "**/node_modules/node-pty/**"
extraResources:
  - from: build/hook
    to: hook
    filter:
      - butler-hook
      - butler-hook.exe
  - from: build/memory-mcp
    to: memory-mcp
    filter:
      - statecore-mcp.cjs
      - butler-sessions-mcp.cjs
      - mcp-hub.cjs
# spawn-helper 的执行位、macOS 没有签名证书时的 ad-hoc 签名、resources 的完整性检查。
afterPack: scripts/after-pack.cjs
publish: null
# 不配置 electronFuses：记忆 MCP 靠 ELECTRON_RUN_AS_NODE 运行，RunAsNode 必须保持可用。
mac:
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.developer-tools
  # macOS 版留出 Apple 网格要求的边距和阴影；electron-builder 转成 .icns。
  icon: build-resources/icon.png
  # 安装包文件名固定、不带空格（GitHub 会把 release 资源名里的空格换成点，README 里写的名字就对不上了）。
  # mac.artifactName 用于 zip，dmg.artifactName 用于 dmg；值与 electron-builder 的默认相同。
  artifactName: "Butler-${version}-${arch}-mac.${ext}"
  # 两种签名只走一种（BTL-258，scripts/mac-signing.cjs 判断）：
  # - 有 CSC_LINK（或 CSC_NAME）时，electron-builder 用 Developer ID Application 签名，打开 hardened runtime；
  #   有 APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER 时再交给 Apple 公证并 staple。release.yml 在设了签名 secret 时这样打包。
  # - 否则（fork、PR、本地打包）after-pack.cjs 做 ad-hoc 签名（arm64 上完全不签名的 app 无法启动），并关掉 electron-builder 自己找证书。
  # 这里不写 identity：写 null 会让 electron-builder 永远跳过签名。
  hardenedRuntime: true
  # app 和 app 里每个可执行文件、原生模块用同一份 entitlements，每一项的理由写在文件里。
  entitlements: build-resources/entitlements.mac.plist
  entitlementsInherit: build-resources/entitlements.mac.plist
  gatekeeperAssess: false
  # 只打 Apple 芯片的包：别的平台的 node-pty 预编译（Windows 的 DLL、Intel 的 Mach-O）用不上，留着还要跟着签名和公证。
  files:
    - "!**/node_modules/node-pty/prebuilds/win32-*/**"
    - "!**/node_modules/node-pty/prebuilds/darwin-x64/**"
dmg:
  artifactName: "Butler-${version}-${arch}.${ext}"
  # 有 Developer ID 时 dmg 本身也签名（release.yml 再把 dmg 交给公证并 staple）；ad-hoc 打包时找不到身份，自动跳过。
  sign: true
win:
  # render-icons.mjs 生成的多尺寸 .ico：小尺寸是专门画的简化版，不让 Windows 从大图缩下来糊掉。
  icon: build-resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
# 都写明（值与 electron-builder 的默认相同），行为固定下来：按用户安装、桌面和开始菜单快捷方式、卸载时不删用户数据（~/.butler 本来也不在安装目录里）。
nsis:
  # 默认是 "${productName} Setup ${version}.${ext}"，带空格。
  artifactName: "Butler-Setup-${version}.${ext}"
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
