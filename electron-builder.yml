# 不签名的安装包（设计文档 2.1、12 节）。发布（推 tag、建 release）由用户完成：publish 关掉，也不配置自动更新。
appId: io.statecore.butler
productName: Butler
copyright: Copyright © 2026 Yuchen Lin
directories:
  output: dist
  # 图标等打包资源的目录。不能用 build/：那里是 hook 和记忆 MCP 的构建产物。
  # 图标由 scripts/render-icons.cjs 从 build-resources/icon-src/ 的 SVG 生成（pnpm icons）。
  buildResources: build-resources
files:
  - out/**/*
  - package.json
  # 运行时用不到的东西：source map，node-pty 的测试、TypeScript / C++ 源码和 winpty 源码（Windows 用 prebuilds 和 third_party/conpty）。
  - "!**/*.map"
  - "!**/node_modules/node-pty/lib/**/*.test.js"
  - "!**/node_modules/node-pty/src/**"
  - "!**/node_modules/node-pty/deps/**"
# 原生模块不能在 asar 里执行。
asarUnpack:
  - "**/node_modules/node-pty/**"
extraResources:
  - from: build/hook
    to: hook
    filter:
      - butler-hook
      - butler-hook.exe
  - from: build/memory-mcp
    to: memory-mcp
    filter:
      - statecore-mcp.cjs
      - butler-sessions-mcp.cjs
# spawn-helper 的执行位、macOS 的 ad-hoc 签名、resources 的完整性检查。
afterPack: scripts/after-pack.cjs
publish: null
# 不配置 electronFuses：记忆 MCP 靠 ELECTRON_RUN_AS_NODE 运行，RunAsNode 必须保持可用。
mac:
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.developer-tools
  # macOS 版留出 Apple 网格要求的边距和阴影；electron-builder 转成 .icns。
  icon: build-resources/icon.png
  # 安装包文件名固定、不带空格（GitHub 会把 release 资源名里的空格换成点，README 里写的名字就对不上了）。
  # mac.artifactName 用于 zip，dmg.artifactName 用于 dmg；值与 electron-builder 的默认相同。
  artifactName: "Butler-${version}-${arch}-mac.${ext}"
  # 不用开发者证书签名；after-pack.cjs 做 ad-hoc 签名（arm64 上完全不签名的 app 无法启动）。
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  artifactName: "Butler-${version}-${arch}.${ext}"
win:
  # 铺满画布的版本；electron-builder 转成 .ico。
  icon: build-resources/icon-win.png
  target:
    - target: nsis
      arch: [x64]
# 都写明（值与 electron-builder 的默认相同），行为固定下来：按用户安装、桌面和开始菜单快捷方式、卸载时不删用户数据（~/.butler 本来也不在安装目录里）。
nsis:
  # 默认是 "${productName} Setup ${version}.${ext}"，带空格。
  artifactName: "Butler-Setup-${version}.${ext}"
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
