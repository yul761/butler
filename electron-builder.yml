# 不签名的安装包（设计文档 2.1、12 节）。发布（推 tag、建 release）由用户完成：publish 关掉，也不配置自动更新。
appId: io.github.yul761.butler
productName: Butler
copyright: Copyright © 2026 Yuchen Lin
directories:
  output: dist
  # 图标等打包资源的目录（没有就用 Electron 默认图标）。不能用 build/：那里是 hook 和记忆 MCP 的构建产物。
  buildResources: build-resources
files:
  - out/**/*
  - package.json
  # 运行时用不到的东西：source map，node-pty 的测试、TypeScript / C++ 源码和 winpty 源码（Windows 用 prebuilds 和 third_party/conpty）。
  - "!**/*.map"
  - "!**/node_modules/node-pty/lib/**/*.test.js"
  - "!**/node_modules/node-pty/src/**"
  - "!**/node_modules/node-pty/deps/**"
# 原生模块不能在 asar 里执行。
asarUnpack:
  - "**/node_modules/node-pty/**"
extraResources:
  - from: build/hook
    to: hook
    filter:
      - butler-hook
      - butler-hook.exe
  - from: build/memory-mcp
    to: memory-mcp
    filter:
      - statecore-mcp.cjs
# spawn-helper 的执行位、macOS 的 ad-hoc 签名、resources 的完整性检查。
afterPack: scripts/after-pack.cjs
publish: null
# 不配置 electronFuses：记忆 MCP 靠 ELECTRON_RUN_AS_NODE 运行，RunAsNode 必须保持可用。
mac:
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.developer-tools
  # 不用开发者证书签名；after-pack.cjs 做 ad-hoc 签名（arm64 上完全不签名的 app 无法启动）。
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
win:
  target:
    - target: nsis
      arch: [x64]
# 都写明（值与 electron-builder 的默认相同），行为固定下来：按用户安装、桌面和开始菜单快捷方式、卸载时不删用户数据（~/.butler 本来也不在安装目录里）。
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
