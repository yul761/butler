<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12.136 -12.136 124.272 124.272">
  <!-- Butler 应用图标（方向 E1：卡片叠）。macOS 版：按 Apple 的网格，图标主体占 1024 画布里的 824，四周留白放阴影。
       图形和 Windows 版（app-win.svg）一样：蓝底白卡片，深色、浅色的 Dock 和任务栏上都看得清。 -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.4" stdDeviation="1.6" flood-color="#0B1220" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="100" height="100" rx="22.5" fill="#2F6FEB" filter="url(#shadow)"/>
  <rect x="42" y="14" width="42" height="50" rx="7" fill="#FFFFFF" fill-opacity="0.45"/>
  <rect x="31" y="25" width="42" height="50" rx="7" fill="#FFFFFF" fill-opacity="0.7"/>
  <rect x="20" y="36" width="42" height="50" rx="7" fill="#FFFFFF"/>
  <rect x="27" y="44" width="17" height="7" rx="3.5" fill="#2F6FEB"/>
  <rect x="27" y="57" width="27" height="4" rx="2" fill="#B9C6DA"/>
  <rect x="27" y="65" width="19" height="4" rx="2" fill="#B9C6DA"/>
  <circle cx="53" cy="77" r="4" fill="#2E9E6B"/>
</svg>
