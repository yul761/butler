name: Bug report
description: Something in Shipherd doesn't work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Only **What happened** is required. Please don't paste private code, ticket titles or company names.
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you did, what you expected, and what Shipherd did instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Optional. The shortest way to make it happen again.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Filled in by Shipherd's "Send feedback…" (Shipherd version, OS, architecture, Claude Code version).
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Optional. Drag the redacted diagnostics file Shipherd saved to your Downloads folder into this box.
