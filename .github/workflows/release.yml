name: Release

on:
  push:
    tags: ["v*"]
  # Manual run: builds, signs and notarizes (macOS) and uploads the installers as artifacts. It creates no release, except
  # on a v* tag with skip_ci_check on (BTL-262: the explicit override of the CI check, see the ci-gate job).
  # Used to try the macOS signing secrets: gh workflow run release.yml --ref main (docs/how-it-works.md, "Signing the macOS build of a fork").
  # The secrets live in the protected environment "release" (BTL-259), which only main and v* tags may use: a run on any
  # other ref builds macOS ad-hoc, or fails right away with require_signing on.
  workflow_dispatch:
    inputs:
      require_signing:
        description: Fail unless the macOS build is signed with Developer ID and notarized (needs the five signing secrets, so only on main or a v* tag)
        type: boolean
        default: true
      # BTL-262: a pushed tag drafts a release only after CI on the tagged commit is green. This is the one explicit way
      # around that: run it by hand on the v* tag with this on, and it drafts the release without looking at CI.
      skip_ci_check:
        description: "Run on a v* tag only: draft the release even though CI on the tagged commit is not green (an explicit override; the run log says who used it)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      # One platform's failure must not cancel the other's build (its logs help diagnose); the release job still needs both.
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    # BTL-259: the five signing secrets ([contract:mac-signing]) are environment secrets of "release", whose deployment
    # policy allows only the branch main and v* tags. Only the macOS build on such a ref uses it; Windows (never signed)
    # and every other ref get no environment (an empty name means none, so no "not allowed to deploy" failure) and
    # therefore no signing secrets: macOS falls back to ad-hoc (the signing decision below also ignores repository-level
    # copies there). A fork without this environment gets an empty one created by GitHub, and repository-level secrets
    # of the same names still apply there.
    environment: ${{ startsWith(matrix.os, 'macos') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'release' || '' }}
    # Notarization waits on Apple's queue twice (the app inside electron-builder, then the dmg, up to 45 minutes).
    timeout-minutes: 120
    env:
      # Never pick up a signing identity from the runner's keychain. Windows stays unsigned; the macOS Developer ID build
      # turns discovery on for the packaging step only, where the only identity is the one imported from CSC_LINK.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      # BTL-259: a manual run that must sign fails at once on a ref that cannot use the "release" environment, instead of
      # building for half an hour and then failing for missing secrets (or, while repository-level copies of the secrets
      # still exist, signing on a branch that should not).
      - name: Signing needs main or a v* tag
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && inputs.require_signing && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          echo "::error::require_signing is on, but signing is only available on main or a v* tag: the signing secrets are in the protected environment \"release\", which $GITHUB_REF_NAME cannot use. Run it with --ref main, or turn require_signing off for an ad-hoc build."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.0
      # .node-version is 26.3.0: build:hook needs node --build-sea.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Tag must match the package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      # Electron 44 has no postinstall (see ci.yml): download the binary before the tests that launch it.
      - name: Download the Electron binary
        run: pnpm exec install-electron
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:hook
      # BTL-258: Developer ID when all five signing secrets ([contract:mac-signing]) are set, ad-hoc when none is (forks,
      # and since BTL-259 any ref but main and v* tags), and a failure when only some are. Only whether each secret is set
      # reaches this step, never its value. On any other ref a secret counts as unset even if a repository-level copy
      # exists, so signing happens only on main and v* tags wherever the secrets are kept.
      - name: Decide how to sign the macOS build
        id: signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          HAS_CSC_LINK: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && secrets.CSC_LINK != '' }}
          HAS_CSC_KEY_PASSWORD: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && secrets.CSC_KEY_PASSWORD != '' }}
          HAS_APPLE_API_KEY_P8: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && secrets.APPLE_API_KEY_P8 != '' }}
          HAS_APPLE_API_KEY_ID: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && secrets.APPLE_API_KEY_ID != '' }}
          HAS_APPLE_API_ISSUER: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && secrets.APPLE_API_ISSUER != '' }}
          REQUIRE_SIGNING: ${{ github.event_name == 'workflow_dispatch' && inputs.require_signing }}
        run: node scripts/mac-signing.cjs release
      # notarytool needs the App Store Connect API key as a file. It lives in a private directory under the runner temp
      # dir and is deleted by the always() step below; its contents are never printed.
      - name: Write the App Store Connect API key to a temporary file
        if: steps.signing.outputs.mode == 'developer-id'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          dir="$(mktemp -d "$RUNNER_TEMP/asc-key.XXXXXX")"
          chmod 700 "$dir"
          (umask 077 && printf '%s\n' "$APPLE_API_KEY_P8" > "$dir/AuthKey.p8")
          echo "APPLE_API_KEY=$dir/AuthKey.p8" >> "$GITHUB_ENV"
      # Windows: unsigned (design 12). macOS without the secrets: ad-hoc signed by scripts/after-pack.cjs.
      - name: Installers (Windows unsigned, macOS ad-hoc)
        if: steps.signing.outputs.mode != 'developer-id'
        run: pnpm dist
      # macOS with the secrets: electron-builder imports the certificate from CSC_LINK into a temporary keychain, signs
      # with Developer ID and the hardened runtime, then notarizes and staples the app. The secrets go only to this step
      # (an empty CSC_LINK is not "unset" to electron-builder, so the unsigned step must not see these names at all).
      - name: Installers (macOS signed with Developer ID and notarized)
        if: steps.signing.outputs.mode == 'developer-id'
        run: pnpm dist
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      # electron-builder notarizes and staples the app (so the zip carries a stapled app) and signs the dmg; the dmg
      # itself is notarized and stapled here so it also opens offline without a Gatekeeper prompt.
      - name: Notarize and staple the dmg
        if: steps.signing.outputs.mode == 'developer-id'
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          for dmg in dist/*.dmg; do
            result="$RUNNER_TEMP/notary-result.json"
            # A rejected submission can exit non-zero: read the status from the JSON either way, then print Apple's log.
            xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
              --wait --timeout 45m --output-format json > "$result" || true
            status="$(node -p 'try { require(process.argv[1]).status ?? "unknown" } catch { "no result" }' "$result")"
            id="$(node -p 'try { require(process.argv[1]).id ?? "" } catch { "" }' "$result")"
            echo "notarization of $(basename "$dmg"): $status ${id:+($id)}"
            if [ "$status" != "Accepted" ]; then
              if [ -n "$id" ]; then
                xcrun notarytool log "$id" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" || true
              fi
              exit 1
            fi
            xcrun stapler staple "$dmg"
          done
      - name: Delete the App Store Connect API key
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [ -n "${APPLE_API_KEY:-}" ]; then rm -rf "$(dirname "$APPLE_API_KEY")"; fi
      - name: Verify the package contents (hook, memory MCP, node-pty prebuilds)
        run: node scripts/verify-package.mjs dist
      # Signatures of every Mach-O inside, the zip and the dmg, Gatekeeper and the stapled tickets (Developer ID), and a
      # smoke run of the packaged app, the ELECTRON_RUN_AS_NODE memory MCP runtime and shipherd-hook.
      - name: Verify the macOS signature and run the packaged app
        if: runner.os == 'macOS'
        run: node scripts/verify-mac-signing.mjs dist --mode ${{ steps.signing.outputs.mode }}
      # Installers only: dist/Shipherd-Setup-*.exe, never electron-builder's __uninstaller-nsis-*.exe stub.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shipherd-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/Shipherd-Setup-*.exe
          if-no-files-found: error

  # BTL-262: no release unless CI (ci.yml, both platforms, every job) is green on the commit the tag points to. 4.1.2 went
  # out while main's CI was red. The release flow pushes the version commit to main and then the tag, so CI and this
  # workflow start together: this job waits for that CI run to finish (in parallel with the build) instead of failing
  # because there is no result yet. A red CI fails this job and the release job does not run; after fixing (or
  # re-running a flaky CI), re-run this workflow's failed jobs.
  # Only when a release can follow: a pushed tag, or the manual skip_ci_check override. A manual run on a tag without it
  # only builds (the release job is skipped), so waiting up to 150 minutes for CI there would be pointless.
  ci-gate:
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.skip_ci_check)
    runs-on: ubuntu-latest
    timeout-minutes: 160
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: CI check skipped by hand
        if: github.event_name == 'workflow_dispatch' && inputs.skip_ci_check
        shell: bash
        run: echo "::warning::$GITHUB_ACTOR drafted $GITHUB_REF_NAME with skip_ci_check, without waiting for CI on the tagged commit."
      - name: Wait for CI on the tagged commit to pass
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_ci_check) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wait-for-ci.mjs "$GITHUB_REF_NAME"

  release:
    needs: [build, ci-gate]
    # A pushed tag drafts a release; a manual run on a tag ref only builds, unless it is the explicit skip_ci_check override.
    if: startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.skip_ci_check))
    runs-on: ubuntu-latest
    # BTL-259: only to see whether CSC_LINK is set (the signing secrets are environment secrets of "release"). This job
    # runs only on a v* tag ref (pushed, or by hand with skip_ci_check), which the environment allows.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      # The build job fails when only some signing secrets are set, so CSC_LINK being set means the macOS build was signed.
      - name: Draft release (the maintainer reviews and publishes it by hand)
        env:
          GH_TOKEN: ${{ github.token }}
          MAC_SIGNED: ${{ secrets.CSC_LINK != '' }}
          SKIPPED_CI: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_ci_check }}
        run: |
          if [ "$MAC_SIGNED" = "true" ]; then
            notes="The macOS build is signed with Developer ID and notarized by Apple. The Windows installer is unsigned: see the README for SmartScreen."
          else
            notes="The macOS build is only ad-hoc signed (no signing secrets), so Gatekeeper blocks it until it is allowed in System Settings → Privacy & Security. The Windows installer is unsigned: see the README for SmartScreen."
          fi
          if [ "$SKIPPED_CI" = "true" ]; then
            notes="$(printf '%s\n\n%s' "$notes" "Drafted with skip_ci_check by $GITHUB_ACTOR: CI on this commit was not required to pass.")"
          fi
          gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --draft --title "Shipherd $GITHUB_REF_NAME" --notes "$notes"
